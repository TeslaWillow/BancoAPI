<div class="form-field">
  <label [for]="forId()" class="form-field__label">
    {{ label() }}
    @if (required()) {
      <span class="form-field__required" aria-hidden="true">*</span>
    }
  </label>

  <div class="form-field__control">
    <ng-content></ng-content>
  </div>

  @if (errorMessage()) {
    <span [id]="forId() + '-error'" class="form-field__error" role="alert">
      {{ errorMessage() }}
    </span>
  }
</div>
