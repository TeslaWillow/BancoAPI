<div class="input-field">
  @if (label()) {
    <label [for]="id()" class="input-field__label">
      {{ label() }}
      @if (required()) {
        <span class="input-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-invalid]="!!errorMessage()"
    [attr.aria-describedby]="errorMessage() ? id() + '-error' : null"
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="input-field__control"
    [class.input-field__control--error]="!!errorMessage()"
  />

  @if (errorMessage()) {
    <span [id]="id() + '-error'" class="input-field__error" role="alert">
      {{ errorMessage() }}
    </span>
  }
</div>
