<!-- ./src/app/features/cuentas/components/cuenta-form/cuenta-form.component.html -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label for="accountNumber">Número de Cuenta *</label>
    <input
      id="accountNumber"
      type="text"
      formControlName="accountNumber"
      [class.is-invalid]="isInvalid('accountNumber')"
    />
  </div>

  <div class="form-group">
    <label for="accountType">Tipo de Cuenta *</label>
    <select id="accountType" formControlName="accountType">
      <option value="AHORROS">Ahorros</option>
      <option value="CORRIENTE">Corriente</option>
    </select>
  </div>

  <div class="form-group">
    <label for="initialBalance">Saldo Inicial *</label>
    <input
      id="initialBalance"
      type="number"
      formControlName="initialBalance"
      [class.is-invalid]="isInvalid('initialBalance')"
    />
  </div>

  <div class="form-group">
    <label for="clientId">Cliente *</label>
    <select id="clientId" formControlName="clientId" [class.is-invalid]="isInvalid('clientId')">
      <option value="" disabled>Seleccione un cliente</option>
      @for (cliente of clientes; track cliente.id) {
        <option [value]="cliente.clientId">{{ cliente.fullName }} ({{ cliente.clientId }})</option>
      }
    </select>
  </div>

  <div class="form-group checkbox-group full-width">
    <label>
      <input type="checkbox" formControlName="status" />
      Estado Activo
    </label>
  </div>

  <div class="form-actions full-width">
    <app-button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</app-button>
    <app-button type="submit" class="btn btn-primary">Guardar</app-button>
  </div>
</form>
