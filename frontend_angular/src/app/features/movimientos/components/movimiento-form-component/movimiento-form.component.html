<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">

  @if (errorMessage) {
    <div class="error-alert full-width">
      {{ errorMessage }}
    </div>
  }

  <app-form-field label="Cuenta" forId="accountNumber" [required]="true" class="full-width"
    [errorMessage]="isInvalid('accountNumber') ? 'Seleccione una cuenta' : null">
    <select id="accountNumber" formControlName="accountNumber" class="form-select"
      [class.form-select--error]="isInvalid('accountNumber')">
      <option value="" disabled>Seleccione una cuenta</option>
      @for (cuenta of cuentas; track cuenta.id) {
        <option [value]="cuenta.accountNumber">
          {{ cuenta.accountNumber }} ({{ cuenta.accountType }})
        </option>
      }
    </select>
  </app-form-field>

  <app-form-field label="Tipo de Movimiento" forId="movementType" [required]="true">
    <select id="movementType" formControlName="movementType" class="form-select">
      <option value="DEPOSITO">Depósito</option>
      <option value="RETIRO">Retiro</option>
    </select>
  </app-form-field>

  <app-input
    id="value"
    label="Monto"
    type="number"
    placeholder="0.00"
    formControlName="value"
    [required]="true"
    [errorMessage]="isInvalid('value') ? 'Ingrese un monto mayor a 0' : null"
  />

  <div class="form-actions full-width">
    <app-button type="button" variant="outline" (clicked)="onCancel()">Cancelar</app-button>
    <app-button type="submit" variant="primary" [disabled]="form.invalid">Registrar</app-button>
  </div>

</form>
