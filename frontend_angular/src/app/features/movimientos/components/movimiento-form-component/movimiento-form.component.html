<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  @if (errorMessage) {
    <div class="error-alert full-width">
      {{ errorMessage }}
    </div>
  }

  <div class="form-group full-width">
    <label for="accountNumber">Cuenta *</label>
    <select
      id="accountNumber"
      formControlName="accountNumber"
      [class.is-invalid]="isInvalid('accountNumber')"
    >
      <option value="" disabled>Seleccione una cuenta</option>
      @for (cuenta of cuentas; track cuenta.id) {
        <option [value]="cuenta.accountNumber">
          {{ cuenta.accountNumber }} ({{ cuenta.accountType }})
        </option>
      }
    </select>
  </div>

  <div class="form-group">
    <label for="movementType">Tipo de Movimiento *</label>
    <select id="movementType" formControlName="movementType">
      <option value="DEPOSITO">Depósito</option>
      <option value="RETIRO">Retiro</option>
    </select>
  </div>

  <div class="form-group">
    <label for="value">Monto *</label>
    <input
      id="value"
      type="number"
      step="0.01"
      formControlName="value"
      [class.is-invalid]="isInvalid('value')"
    />
  </div>

  <div class="form-actions full-width">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Registrar</button>
  </div>
</form>
