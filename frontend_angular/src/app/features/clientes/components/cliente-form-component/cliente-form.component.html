<!-- ./src/app/features/clientes/components/cliente-form/cliente-form.component.html -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <app-input
    id="fullName"
    label="Nombre Completo"
    placeholder="Ej: Juan Pérez"
    formControlName="fullName"
    [required]="true"
    [errorMessage]="isInvalid('fullName') ? 'El nombre es requerido' : null"
  />

  <app-input
    id="documentId"
    label="Identificación / DNI"
    placeholder="Ej: 1712345678"
    formControlName="documentId"
    [required]="true"
    [errorMessage]="isInvalid('documentId') ? 'La identificación es requerida' : null"
  />

  <app-input
    id="clientId"
    label="ID de Cliente / Username"
    placeholder="Ej: jperez"
    formControlName="clientId"
    [required]="true"
    [errorMessage]="isInvalid('clientId') ? 'El ID de cliente es requerido' : null"
  />

  @if (!isEditMode) {
    <app-input
      id="password"
      label="Contraseña"
      type="password"
      placeholder="Ingrese una contraseña"
      formControlName="password"
      [required]="true"
      [errorMessage]="isInvalid('password') ? 'La contraseña es requerida' : null"
    />
  }

  <app-form-field label="Género" forId="gender" [required]="true">
    <select id="gender" formControlName="gender" class="form-select">
      <option value="MASCULINO">Masculino</option>
      <option value="FEMENINO">Femenino</option>
      <option value="OTRO">Otro</option>
    </select>
  </app-form-field>

  <app-input
    id="age"
    label="Edad"
    type="number"
    placeholder="18"
    formControlName="age"
    [required]="true"
    [errorMessage]="isInvalid('age') ? 'La edad debe ser mayor a 0' : null"
  />

  <div class="full-width">
    <app-input
      id="address"
      label="Dirección"
      placeholder="Ej: Av. Principal 123"
      formControlName="address"
      [required]="true"
      [errorMessage]="isInvalid('address') ? 'La dirección es requerida' : null"
    />
  </div>

  <app-input
    id="phone"
    label="Teléfono"
    placeholder="Ej: 0998765432"
    formControlName="phone"
    [required]="true"
    [errorMessage]="isInvalid('phone') ? 'El teléfono es requerido' : null"
  />

  <div class="form-actions full-width">
    <app-button type="button" variant="outline" (clicked)="onCancel()">Cancelar</app-button>
    <app-button type="submit" variant="primary">
      {{ isEditMode ? 'Actualizar' : 'Guardar' }}
    </app-button>
  </div>
</form>
