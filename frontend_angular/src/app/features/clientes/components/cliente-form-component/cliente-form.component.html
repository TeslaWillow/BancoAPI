<!-- ./src/app/features/clientes/components/cliente-form/cliente-form.component.html -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label for="fullName">Nombre Completo *</label>
    <input
      id="fullName"
      type="text"
      formControlName="fullName"
      [class.is-invalid]="isInvalid('fullName')"
    />
  </div>

  <div class="form-group">
    <label for="documentId">Identificación / DNI *</label>
    <input
      id="documentId"
      type="text"
      formControlName="documentId"
      [class.is-invalid]="isInvalid('documentId')"
    />
  </div>

  <div class="form-group">
    <label for="clientId">ID de Cliente / Username *</label>
    <input
      id="clientId"
      type="text"
      formControlName="clientId"
      [class.is-invalid]="isInvalid('clientId')"
    />
  </div>

  <div class="form-group">
    <label for="password">Contraseña *</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      [class.is-invalid]="isInvalid('password')"
    />
  </div>

  <div class="form-group">
    <label for="gender">Género *</label>
    <select id="gender" formControlName="gender" [class.is-invalid]="isInvalid('gender')">
      <option value="MASCULINO">Masculino</option>
      <option value="FEMENINO">Femenino</option>
      <option value="OTRO">Otro</option>
    </select>
  </div>

  <div class="form-group">
    <label for="age">Edad *</label>
    <input id="age" type="number" formControlName="age" [class.is-invalid]="isInvalid('age')" />
  </div>

  <div class="form-group full-width">
    <label for="address">Dirección *</label>
    <input
      id="address"
      type="text"
      formControlName="address"
      [class.is-invalid]="isInvalid('address')"
    />
  </div>

  <div class="form-group">
    <label for="phone">Teléfono *</label>
    <input id="phone" type="text" formControlName="phone" [class.is-invalid]="isInvalid('phone')" />
  </div>

  <div class="form-actions full-width">
    <app-button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</app-button>
    <app-button type="submit" class="btn btn-primary">Guardar</app-button>
  </div>
</form>
