<!-- ./frontend_angular/src/app/features/clientes/pages/clientes-page/clientes-page.component.html -->
<div class="page-container">
  <header class="page-header">
    <h1 class="page-title">Clientes</h1>
  </header>

  <app-header-actions
    searchPlaceholder="Buscar por nombre o ID..."
    buttonText="Nuevo Cliente"
    (search)="onSearch($event)"
    (actionClick)="openModal()"
  ></app-header-actions>

  <app-table
    [columns]="columns()"
    [data]="filteredClientes()"
    [isLoading]="isLoading()"
    emptyMessage="No se encontraron clientes registrados."
    ariaLabel="Tabla de Clientes"
  ></app-table>

  <ng-template #actionsTemplate let-cliente>
    <app-button
      type="button"
      variant="danger"
      size="sm"
      (click)="promptDelete(cliente)"
      title="Eliminar cliente"
      aria-label="Eliminar cliente"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 6h18"></path>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    </app-button>
  </ng-template>

  <app-modal [isOpen]="isModalOpen()" title="Registrar Nuevo Cliente" (closeModal)="closeModal()">
    <div modal-body>
      @if (isModalOpen()) {
        <app-cliente-form (submitForm)="handleCreateCliente($event)" (cancel)="closeModal()" />
      }
    </div>
  </app-modal>

  <app-confirm-dialog-component
    [isOpen]="isConfirmDialogOpen()"
    title="Eliminar Cliente"
    [message]="confirmDialogMessage()"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />
</div>
